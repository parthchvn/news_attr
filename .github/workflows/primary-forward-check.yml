name: Primary feed recovery check
on:
  workflow_dispatch:
  push:
    paths:
      - 'polymarket_context/primary.py'
      - 'polymarket_context/primary_audit.py'
      - 'tests/test_primary_recovery.py'
      - '.github/workflows/primary-forward-check.yml'
permissions:
  contents: write
concurrency:
  group: primary-forward-recovery-check
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[parquet,dev]'
      - name: All software tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/primary-tests.txt
      - name: Two bounded real feed cycles and integrity audit
        shell: bash
        run: |
          mkdir -p outputs/primary_forward_check
          git rev-parse HEAD > outputs/primary_forward_check/generating_commit.txt
          cp /tmp/primary-tests.txt outputs/primary_forward_check/test_results.txt
          python -m polymarket_context.primary --plan configs/primary_forward.json --output outputs/primary_forward_check
          python -m polymarket_context.primary --plan configs/primary_forward.json --output outputs/primary_forward_check
          python -m polymarket_context.primary_audit --input outputs/primary_forward_check
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/primary_forward_check')
          cycles=[json.loads(x) for x in (root/'cycles.jsonl').read_text().splitlines()]
          latest=cycles[-2:]
          assert len(latest)==2
          assert all(c['status']=='complete' and not c['errors'] and c['selected_statements']>0 for c in latest)
          audit=json.loads((root/'audit.json').read_text())
          assert audit['validation_status']=='passed'
          print(json.dumps({'last_two_cycles':[{'records_added':c['records_added'],'unchanged_documents':c['unchanged_documents'],'documents':c['documents'],'errors':c['errors']} for c in latest]},indent=2))
          PY
      - name: Preserve snapshots, logs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-forward-recovery
          path: outputs/primary_forward_check/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish successful bounded check without modifying prior data
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/primary_forward_check
          if ! git diff --cached --quiet; then
            git commit -m 'Record two real feed cycles and canonical-content audit'
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep 3
            done
            test "$pushed" = true
          fi
          cat outputs/primary_forward_check/audit.json >> "$GITHUB_STEP_SUMMARY"

name: Software tests
on:
  push:
    paths: ['polymarket_context/**', 'tests/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[parquet,dev]'
      - run: python -m pytest -q

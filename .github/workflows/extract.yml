name: Extract requested Polymarket markets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract.yml'
      - 'scripts/extract_hf.py'
permissions:
  contents: write
concurrency:
  group: two-market-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install 'duckdb>=1.3,<2' 'pandas>=2.2,<3' 'pyarrow>=18,<24'
      - name: Filter pinned HF snapshot
        timeout-minutes: 28
        run: python scripts/extract_hf.py --output data/selected
      - name: Preserve extraction results and error provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-markets
          path: |
            data/selected/*.parquet
            data/selected/*.json
            data/selected/*.csv
            data/selected/*.csv.gz
          retention-days: 14
      - name: Commit small filtered extract (not the full source)
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/selected/markets.csv data/selected/markets.json data/selected/trades.parquet data/selected/extraction_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified two-market HF extract and provenance'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
